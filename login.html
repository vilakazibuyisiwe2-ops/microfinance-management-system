<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroFinance Pro - Login</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="JavaScript.js"></script>
</head>
<body>

<main class="page-wrapper login-wrapper">
    <!-- Styled with your premium 'business-class' overlay -->
    <div class="card business-class login-card">
        
        <h1 class="logo-title">MicroFinance Pro</h1>
        <h2 class="hero-subtitle">Secure Gateway Access</h2>

        <form onsubmit="event.preventDefault(); login();" class="login-form-element">
            
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <!-- Dynamic Error Feedback Line -->
            <p id="message" class="auth-error-msg"></p>

            <div class="button-group">
                <button type="submit" class="btn-primary">Authenticate Account</button>
            </div>

        </form>

    </div>
</main>

</body>
</html>
