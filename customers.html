  <!-- Google tag -->

<body>

<!-- Unified Navigation Bar -->
<header class="navbar-wrapper">
    <nav class="main-nav">
        <a href="index.html">Dashboard</a>
        <a href="customers.html" class="active">Customers</a>

        <a href="settings.html">Settings</a>
    </nav>
</header>

<main class="page-wrapper">
    <!-- Styled with your premium 'business-class' overlay -->
    <div class="card business-class">
        <form class="loan-form" onsubmit="event.preventDefault(); submitLoanApplication();">
            
            <h1 class="page-title">Apply for a Loan</h1>

            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="custName" class="form-input" placeholder="Buyisiwe Sithole" required>
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="custPhone" class="form-input" placeholder="082 123 4567" required>
            </div>

            <div class="form-group">
                <label class="form-label">Loan Amount (R)</label>
                <input type="number" id="custAmount" class="form-input" placeholder="5000" min="500" required>
            </div>

            <div class="form-group">
                <label class="form-label">Repayment Period</label>
                <div class="select-wrapper">
                    <select id="custPeriod" class="form-input form-select" required>
                        <option value="" disabled selected>Select months</option>
                        <option value="6">6 months</option>
                        <option value="12">12 months</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">Submit Application</button>
            </div>

        </form>
    </div>
</main>

</body>

</html>
