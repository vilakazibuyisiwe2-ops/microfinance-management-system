<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apply for Loan - MicroFinance Pro</title>
  <link rel="stylesheet" href="styles.css">
<script defer src="JavaScript.js"></script>
</head>
<body>
  <div class="loan-form">
    <h2>Apply for a Loan</h2>
    <form id="loanForm">
      <label>Full Name</label>
      <input type="text" id="name" required>

      <label>Phone Number</label>
      <input type="tel" id="phone" required>

      <label>Loan Amount R</label>
      <input type="number" id="amount" min="500" max="50000" required>

      <label>Repayment Period</label>
      <select id="months" required>
        <option value="">Select months</option>
        <option value="3">3 months</option>
        <option value="6">6 months - 10%</option>
        <option value="12">12 months - 20%</option>
        <option value="24">24 months - 30%</option>
      </select>

      <div id="summary"></div>
      <button type="submit">Submit Application</button>
    </form>
  </div>

  <script src="loan.js"></script>
</body>
</html>
