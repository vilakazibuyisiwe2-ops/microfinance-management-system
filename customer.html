<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apply for Loan - MicroFinance Pro</title>

  <link rel="stylesheet" href="styles.css">
  <script defer src="JavaScript.js"></script>

  <!-- Google tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SM5PENRZQH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SM5PENRZQH');
  </script>
</head>

<body>

<div class="page-wrapper">

  <div class="card">

    <form class="loan-form">

      <h2 style="text-align:center;">Apply for a Loan</h2>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Buyisiwe Sithole">
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" placeholder="082 123 4567">
      </div>

      <div class="form-group">
        <label>Loan Amount (R)</label>
        <input type="number" placeholder="5000">
      </div>

      <div class="form-group">
        <label>Repayment Period</label>
        <select>
          <option>Select months</option>
          <option>6 months</option>
          <option>12 months</option>
        </select>
      </div>

      <div class="button-group">
        <button type="submit">Submit Application</button>
      </div>

    </form>

  </div>

</div>

</body>
</html>
